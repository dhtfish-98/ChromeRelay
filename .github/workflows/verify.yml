name: macOS verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-26
    env:
      TMPDIR: ${{ github.workspace }}/Build/临时
      TMP: ${{ github.workspace }}/Build/临时
      TEMP: ${{ github.workspace }}/Build/临时
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/Build/缓存/python
      PIP_CACHE_DIR: ${{ github.workspace }}/Build/缓存/pip
      npm_config_cache: ${{ github.workspace }}/Build/缓存/npm
      RUFF_CACHE_DIR: ${{ github.workspace }}/Build/缓存/ruff
      GOCACHE: ${{ github.workspace }}/Build/缓存/go
      GOMODCACHE: ${{ github.workspace }}/Build/缓存/go-mod
      GOTMPDIR: ${{ github.workspace }}/Build/临时
      GOPATH: ${{ github.workspace }}/Build/缓存/go-path
      GOBIN: ${{ github.workspace }}/Build/输出/go-bin
      CARGO_HOME: ${{ github.workspace }}/Build/缓存/cargo
      XDG_CACHE_HOME: ${{ github.workspace }}/Build/缓存/xdg
      CCACHE_DIR: ${{ github.workspace }}/Build/缓存/ccache
      SCCACHE_DIR: ${{ github.workspace }}/Build/缓存/sccache
      NODE_COMPILE_CACHE: ${{ github.workspace }}/Build/缓存/node
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}/Build/源码
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Stage source and restored project inputs under Build
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} 构建.py --stage --ci
        working-directory: ${{ github.workspace }}
      - name: Install build dependencies
        run: brew install cmake ninja boost nlohmann-json
      - name: Record toolchain
        run: |
          mkdir -p build/ci-evidence
          { sw_vers; uname -m; clang++ --version; cmake --version; brew list --versions; } > build/ci-evidence/toolchain.txt
      - name: Configure and build Release
        run: |
          set -o pipefail
          cmake --preset release 2>&1 | tee build/ci-evidence/configure.txt
          cmake --build --preset release --parallel 2 2>&1 | tee build/ci-evidence/build.txt
      - name: Run native checks
        run: |
          set -o pipefail
          ctest --preset release --verbose 2>&1 | tee build/ci-evidence/ctest.txt
      - name: Verify installed package and independent consumer
        run: |
          set -o pipefail
          cmake --install build/release --prefix "$PWD/build/installed" 2>&1 | tee build/ci-evidence/install.txt
          cmake -S examples/consumer -B build/consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/build/installed"
          cmake --build build/consumer --parallel 2
          build/consumer/relay-consumer | tee build/ci-evidence/consumer.txt
          python3 tests/integration/verify_cli.py --binary build/installed/bin/chrome-relay --evidence build/ci-evidence/installed-cli.json
      - name: Prepare owned browser fixtures
        run: |
          if [ ! -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then
            brew install --cask google-chrome
          fi
          python3 -m venv build/browser-python
          build/browser-python/bin/pip install Pillow
          echo "$PWD/build/browser-python/bin" >> "$GITHUB_PATH"
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version > build/ci-evidence/chrome-version.txt
      - name: Run owned Chrome and socket fault tests
        run: python3 tests/integration/run_suite.py --build build/release --binary build/installed/bin/chrome-relay --evidence build/ci-evidence/release
      - name: Save verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ChromeRelay-macos-verification-${{ github.sha }}
          path: 'Build/源码/build/ci-evidence/'
          if-no-files-found: error
          retention-days: 14
